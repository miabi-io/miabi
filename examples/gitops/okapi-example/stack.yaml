# GitOps form of the okapi-example template; change the secretEnv jwt_secret before applying.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: okapi-example
spec:
  image: jkaninda/okapi-example
  tag: "latest"
  ports:
    - container: 8080
      scheme: http
      # Requires a platform base domain; see the Route/Domain alternative below.
      externalAccess: true
  externalLabel: okapi
  env:
    # CHANGE ME before applying — stored encrypted (listed under secretEnv).
    JWT_SECRET: "change-me-to-a-long-random-string"
    ENABLE_DOCS: "true"
  secretEnv:
    - JWT_SECRET
  resources:
    memory: 256Mi
    cpu: "0.25"

# ── Alternative: serve on your own hostname ──────────────────────────────────
# Instead of `externalAccess: true`, drop the externalAccess/externalLabel lines
# and add a Domain + Route for a custom host with automatic Let's Encrypt TLS:
#
# ---
# apiVersion: miabi.io/v1
# kind: Domain
# metadata: { name: okapi.example.com }
# spec:
#   tls: acme
# ---
# apiVersion: miabi.io/v1
# kind: Route
# metadata: { name: okapi-example-web }
# spec:
#   hosts: [okapi.example.com]
#   app: okapi-example
#   port: 8080
