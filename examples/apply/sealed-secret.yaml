# Sealed to the workspace key, so safe in git; seal your own: echo -n "$TOKEN" | miabi secrets seal ghcr-token
---
apiVersion: miabi.io/v1
kind: SealedSecret
metadata:
  name: ghcr-token
spec:
  value: sealed:v1:0:
---
apiVersion: miabi.io/v1
kind: Registry
metadata:
  name: ghcr
spec:
  server: ghcr.io
  username: my-org
  password: "${{ secrets.ghcr-token }}"
