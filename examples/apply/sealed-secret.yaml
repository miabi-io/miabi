# A secret you can commit.
#
# A SealedSecret's `spec.value` is encrypted to the workspace's public
# sealing key, so it is safe in git: only that workspace can open it, and only
# for a SealedSecret with this name. It lands in the vault like any Secret and is
# referenced the same way, as ${{ secrets.ghcr-token }}. The value below is sealed to a throwaway key; make your own with:
#
#   echo -n "$TOKEN" | miabi secrets seal ghcr-token >> sealed-secret.yaml
#
# Editing the sealed value in git updates the secret on the next apply, and
# consumers redeploy only if the opened value actually changed.
#
# Apply with:  miabi apply -f sealed-secret.yaml
---
apiVersion: miabi.io/v1
kind: SealedSecret
metadata:
  name: ghcr-token
spec:
  value: sealed:v1:0:
---
apiVersion: miabi.io/v1
kind: Registry
metadata:
  name: ghcr
spec:
  server: ghcr.io
  username: my-org
  password: "${{ secrets.ghcr-token }}"
