# Domain declares an owned zone and its TLS policy; Route exposes an app on a host under it.

apiVersion: miabi.io/v1
kind: Domain
metadata: { name: shop.example.com }
spec:
  tls: acme               # acme (Let's Encrypt, default) | custom (cert uploaded out-of-band)
  wildcard: true          # also covers *.shop.example.com
---
# A second owned hostname served with a custom certificate.
apiVersion: miabi.io/v1
kind: Domain
metadata: { name: secure.shop.example.com }
spec:
  tls: custom
---
# The target application the routes below point at.
apiVersion: miabi.io/v1
kind: Application
metadata: { name: shop-web }
spec:
  image: miabi/guestbook
  tag: "1.0.0"
  command: ["server", "--port=8080"]
  ports:
    - name: http          # lets a Route say port: http
      container: 8080
      scheme: http
---
# Apex + www on a single Route — one rule can answer on several hostnames.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: shop-web }
spec:
  hosts:
    - shop.example.com
    - www.shop.example.com
  app: shop-web
  port: http             # a port name or number
  tls:                   # omitted: HTTPS with an ACME certificate
    enabled: true        # false serves plain HTTP
    # provider: internal-ca   # the gateway certificate provider; omitted, its default
---
# Path-based routing: only /api on the apex host goes to this app.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: shop-api }
spec:
  hosts: [shop.example.com]
  path: /api
  app: shop-web
  port: 8080
---
# Import the cert/key out of band, never in a manifest; tls.certificate names it.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: shop-custom-cert }
spec:
  hosts: [secure.shop.example.com]
  app: shop-web
  port: 8080
  tls:
    certificate: shop-wildcard
---
# maintenance makes the gateway answer with a 503; an apply un-parks a hand-parked route.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: shop-admin }
spec:
  hosts: [admin.shop.example.com]
  app: shop-web
  port: 8080
  security:
    exploitProtection: true
  maintenance:
    enabled: true
    statusCode: 503
    message: Scheduled upgrade — back at 14:00 UTC
---
# Internal/plain-HTTP route (no TLS) — e.g. behind an upstream load balancer.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: shop-internal }
spec:
  hosts: [internal.shop.example.com]
  app: shop-web
  port: 8080
  tls:
    enabled: false
