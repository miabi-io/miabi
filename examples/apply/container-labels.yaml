# Labels are stamped onto the container for a label-driven proxy; reserved io.miabi.*/com.docker.* labels are dropped.
---
apiVersion: miabi.io/v1
kind: Stack
metadata:
  name: edge
spec:
  description: Label-routed edge — the proxy and the apps it fronts
---
# Grant this app the Docker socket (Settings -> Mounts) after the first apply.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: traefik
spec:
  image: traefik
  tag: "v3.3"
  stack: edge
  command:
    - --providers.docker=true
    # Only containers that opt in with traefik.enable are routed.
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80 # inside the container; published below
  ports:
    # 80/443 belong to the platform gateway, so the proxy takes a high port; drop hostPort to auto-allocate.
    - container: 80
      protocol: tcp
      publish: true
      hostPort: 8080
---
# Publishes nothing: traffic reaches it only through the proxy over the stack network.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: web
spec:
  image: nginx
  tag: "1.27-alpine"
  stack: edge
  ports:
    - container: 80
      scheme: http
  containerLabels:
    traefik.enable: "true"
    traefik.http.routers.web.rule: "Host(`app.example.com`)"
    traefik.http.routers.web.entrypoints: web
    traefik.http.services.web.loadbalancer.server.port: "80"
