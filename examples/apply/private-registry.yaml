# Without spec.registry every pull is anonymous, so a private image fails with "manifest unknown".
---
# Keep the token in the vault, not git; the Registry only references it.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: ghcr-token
spec:
  value: ghp_replace_me
---
apiVersion: miabi.io/v1
kind: Registry
metadata:
  name: ghcr
  annotations:
    description: Read-only package token for the org's private images
spec:
  server: ghcr.io
  username: my-org
  # {{ .secrets.X }} copies at apply time (rotation needs a re-apply); ${{ secrets.X }} is read from the vault every pull.
  password: "${{ secrets.ghcr-token }}"
---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: api
spec:
  image: ghcr.io/my-org/api
  tag: v1.4.0
  # A name not in this bundle resolves against the workspace's existing credentials.
  registry: ghcr
  ports:
    - container: 3000
      externalAccess: true
