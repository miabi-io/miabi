# Deploys go live only once the new release is healthy; type is http, command, image (default) or none.
---
# /healthz returns 503 until the database is reachable, so traffic waits for it too.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: guestbook
spec:
  image: miabi/guestbook
  tag: "3.0.0"
  ports:
    - container: 8080
      externalAccess: true
  deployment:
    strategy: rolling
  healthcheck:
    type: http
    path: /healthz
    port: 8080
    intervalSeconds: 10
---
# The start period keeps a slow-warming JVM from being marked unhealthy early.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: billing
spec:
  image: ghcr.io/acme/billing
  tag: "4.2.0"
  ports:
    - container: 8080
  healthcheck:
    type: http
    path: /actuator/health
    startPeriodSeconds: 60
    timeoutSeconds: 10
---
# A command check runs through the container's shell, for a process that serves no HTTP.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: worker
spec:
  image: ghcr.io/acme/worker
  tag: "1.8.0"
  command: ["worker", "--queue", "default"]
  healthcheck:
    type: command
    command: test -f /tmp/worker.alive
    intervalSeconds: 15
    retries: 2
---
# The image's baked-in HTTP check would fail on a worker and loop task replacement; none disables it.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: queue
spec:
  image: serversideup/php
  tag: "8.4-fpm-nginx"
  command: ["php", "artisan", "queue:work"]
  deployment:
    runtime: service
    replicas: 2
  healthcheck:
    type: none
