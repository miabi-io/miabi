# A GitSource keeps a Git path reconciled; committed to a GitOps repo these become nested projects (max 3 levels).
---
# Seal it (`miabi secrets seal`) and use kind: SealedSecret to commit this file.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: github-token
spec:
  value: ghp_replace_me
---
# References the vault entry, so rotating the Secret rotates the credential.
apiVersion: miabi.io/v1
kind: GitRepository
metadata:
  name: miabi-examples
spec:
  url: https://github.com/miabi-io/examples.git
  auth: token            # public | token | ssh
  secretRef: github-token
---
apiVersion: miabi.io/v1
kind: GitSource
metadata:
  name: full-stack
spec:
  # Use repo: <url> instead for a public repository.
  repository: miabi-examples
  ref: main
  path: gitops/full-stack
  syncPolicy: auto
  prune: true
  requireSealedSecrets: true
---
apiVersion: miabi.io/v1
kind: GitSource
metadata:
  name: laravel
spec:
  repo: https://github.com/miabi-io/examples.git
  path: gitops/laravel
  # cascade removes the apps it deployed on delete; the default, orphan, leaves them running.
  deletePolicy: cascade
