# A sync never reruns a Job with the same fingerprint; onRelease runs after the release is live, so keep migrations additive.
---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: shop-api
spec:
  image: ghcr.io/acme/shop-api
  tag: "2.4.0"
---
apiVersion: miabi.io/v1
kind: Job
metadata:
  name: migrate
spec:
  app: shop-api
  command: ["./shop-api", "migrate", "up"]
  runPolicy: onRelease
  timeoutSeconds: 600
---
apiVersion: miabi.io/v1
kind: Job
metadata:
  name: seed-catalog
spec:
  app: shop-api
  command: ["./shop-api", "seed", "catalog"]
  runPolicy: once
---
apiVersion: miabi.io/v1
kind: Job
metadata:
  name: reindex-search
spec:
  app: shop-api
  # Waits for an image bump in the same sync and runs on the new release (waitForDeploy defaults to true).
  command: ["./shop-api", "search", "reindex"]
