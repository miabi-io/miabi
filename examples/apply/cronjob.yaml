# Runs in the app's runtime context; 5-field cron in UTC, missed fires are not backfilled.
---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: shop-api
spec:
  image: ghcr.io/acme/shop-api
  tag: "2.4.0"
---
apiVersion: miabi.io/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  app: shop-api
  schedule: "0 2 * * *"
  command: ["./shop-api", "report", "send"]
  timeoutSeconds: 900
  # Skip a fire while yesterday's report is still running.
  concurrencyPolicy: forbid
  historyLimit: 10
---
apiVersion: miabi.io/v1
kind: CronJob
metadata:
  name: purge-carts
spec:
  app: shop-api
  schedule: "*/30 * * * *"
  command: ["./shop-api", "carts", "purge", "--older-than=24h"]
  security:
    runAsUser: "1000"
