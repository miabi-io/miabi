# Apps configured by mounted files; re-applying a changed file redeploys its mounts unless reloadPolicy is none.
apiVersion: miabi.io/v1
kind: Config
metadata:
  name: prom-conf
spec:
  # Prometheus uses {{ }} itself, so render on << >> and only Miabi's references are substituted.
  delimiters: ["<<", ">>"]
  data:
    prometheus.yml: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/rules/alerts.yml
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
    rules/alerts.yml: |
      groups:
        - name: availability
          rules:
            - alert: TargetDown
              expr: up == 0
              for: 5m
              annotations:
                summary: "{{ $labels.instance }} is down"

---
# The password is rendered from the managed database at apply time, so no credential lives in Git.
apiVersion: miabi.io/v1
kind: Config
metadata:
  name: grafana-datasources
spec:
  sensitive: true
  mode: "0640"
  data:
    metrics.yml: |
      apiVersion: 1
      datasources:
        - name: Metrics
          type: postgres
          url: "{{ .databases.metrics-db.host }}:{{ .databases.metrics-db.port }}"
          user: "{{ .databases.metrics-db.user }}"
          database: "{{ .databases.metrics-db.name }}"
          secureJsonData:
            password: "{{ .databases.metrics-db.password }}"

---
apiVersion: miabi.io/v1
kind: Database
metadata:
  name: metrics-db
spec:
  engine: postgres
  version: "17-alpine"
  instance: auto

---
apiVersion: miabi.io/v1
kind: Volume
metadata:
  name: grafana-data
spec: {}

---
apiVersion: miabi.io/v1
kind: Stack
metadata:
  name: monitoring
spec:
  description: Prometheus and Grafana, configured from mounted files.

---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: prometheus
spec:
  image: prom/prometheus
  tag: "v3.1.0"
  stack: monitoring
  ports:
    - container: 9090
      scheme: http
  mounts:
    # No `key`: every file is projected under this directory, read-only.
    - config: prom-conf
      path: /etc/prometheus
  # Prometheus watches its own rule files; the default `restart` would redeploy on every change.
  reloadPolicy: none

---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: grafana
spec:
  image: grafana/grafana
  tag: "11.5.0"
  stack: monitoring
  ports:
    - container: 3000
      scheme: http
      externalAccess: true
  env:
    GF_SECURITY_ADMIN_USER: admin
  mounts:
    - volume: grafana-data
      path: /var/lib/grafana
    # With `key`, `path` is the exact file location and `mode` applies to this file only.
    - config: grafana-datasources
      key: metrics.yml
      path: /etc/grafana/provisioning/datasources/metrics.yml
      mode: "0444"
