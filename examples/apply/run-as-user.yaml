# Under the restricted profile only a numeric non-root uid is accepted; a name could resolve to uid 0.
---
apiVersion: miabi.io/v1
kind: Volume
metadata:
  name: api-data
spec:
  size: 1Gi
---
# The only form accepted once a workspace is restricted.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: api
spec:
  image: ghcr.io/acme/api
  tag: "2.1.0"
  security:
    runAsUser: "1000:1000"
  ports:
    - container: 8080
      externalAccess: true
  mounts:
    - volume: api-data
      path: /data
---
# Rejected under the restricted profile, which cannot verify a name is non-root.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: worker
spec:
  image: node
  tag: "22-alpine"
  command: ["node", "worker.js"]
  security:
    runAsUser: node
