# Full single-node stack; quick start: cp .env.example .env, edit it, then docker compose up -d.

services:
  miabi-postgres:
    image: postgres:17-alpine
    # Platform identity: lets Miabi recognize its own stack
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-db
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MIABI_DB_USER:-miabi}
      POSTGRES_PASSWORD: ${MIABI_DB_PASSWORD:?set MIABI_DB_PASSWORD}
      POSTGRES_DB: ${MIABI_DB_NAME:-miabi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Private network only, no published ports: an exposed 5432 is how self-hosted databases get breached.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIABI_DB_USER:-miabi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  miabi-redis:
    image: redis:7-alpine
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-cache
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${MIABI_REDIS_PASSWORD:?set MIABI_REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    # Private network only: write access to the asynq queue is code execution in the worker.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MIABI_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves the per-app route files Miabi writes into the shared providers volume.
  gateway:
    # Pin the version Miabi is tested with: "image" in https://versions.miabi.io/v1/gateway/latest.json
    image: jkaninda/goma-gateway:latest
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: gateway
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    depends_on:
      miabi-redis: { condition: service_healthy }
    environment:
      MIABI_DOMAIN: ${MIABI_DOMAIN:?set MIABI_DOMAIN}
      MIABI_ACME_EMAIL: ${MIABI_ACME_EMAIL:-admin@example.com}
      MIABI_REDIS_PASSWORD: ${MIABI_REDIS_PASSWORD}
      # These override goma.yml's `analytics:` block.
      GOMA_ANALYTICS_ENABLED: "true"
      GOMA_ANALYTICS_STREAM: ${MIABI_ANALYTICS_STREAM:-goma:analytics}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./goma.yml:/etc/goma/goma.yml:ro
      - gateway-providers:/etc/goma/providers
      - gateway-certs:/etc/letsencrypt
      # GeoIP (optional): download a country-level .mmdb (MaxMind GeoLite2, DB-IP
      # Lite or IP2Location LITE all work), save it as ./geoip/country.mmdb and
      # uncomment. Goma ships none: every dataset carries license terms only you can
      # accept. Mount the directory, not the file: Goma reloads an updated database
      # without a restart, and a single-file mount never sees a file replaced by
      # rename. Without it the country panels stay empty.
      # - ./geoip:/etc/goma/geoip:ro
    # The one service on both, deliberately: `miabi-internal` to reach Miabi and
    # Redis, `miabi-proxy` to reach your apps and the internet for ACME. Being the only
    # bridge is what keeps the shared network ingress-only — traffic crosses into
    # the platform at a proxy that terminates TLS and applies your middlewares,
    # not at a flat Docker bridge.
    networks: [miabi-internal, miabi-proxy]

  # Also the process that holds runner tunnels and builds.
  miabi:
    image: ${MIABI_IMAGE:-miabi/miabi:latest}
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    # Runs as root by default. To run unprivileged, uncomment `user` below — the
    # image ships a miabi account (uid/gid 10001) and its data dirs are owned by
    # it, so named volumes just work. group_add still grants Docker socket access
    # either way:
    #   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
    # user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      miabi-postgres: { condition: service_healthy }
      miabi-redis: { condition: service_healthy }
    # Every Miabi setting comes from .env; see .env.example for what must be filled in.
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-providers:/etc/goma/providers
      # Share this volume with the optional worker so the panel can read the logs it writes.
      - miabi-logs:/var/lib/miabi/logs
      - /proc:/host/proc:ro
    # Private network only: :9000 directly would be plaintext, bypass route middlewares and be an SSRF target.
    networks: [miabi-internal]

  # OPTIONAL — scale the background worker out of the panel process. It consumes
  # the local job/deploy/backup queues; the panel's embedded worker keeps the
  # remote-node + runner-dispatch work (it holds the tunnels). It MUST mount the
  # same miabi-logs volume so the panel can read the logs it externalizes.
  # Uncomment to enable.
  # miabi-worker:
  #   image: ${MIABI_IMAGE:-miabi/miabi:latest}
  #   command: ["worker"]
  #   restart: unless-stopped
  #   group_add: ["${DOCKER_GID:-999}"]
  #   depends_on:
  #     miabi-postgres: { condition: service_healthy }
  #     miabi-redis: { condition: service_healthy }
  #   env_file: [.env]
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - miabi-logs:/var/lib/miabi/logs
  #   networks: [miabi-internal]

volumes:
  pgdata:
  redisdata:
  gateway-providers:
  gateway-certs:
  miabi-logs:

networks:
  # Shared: the gateway plus every app container Miabi exposes with a route.
  miabi-proxy:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: ${MIABI_PROXY_NETWORK:-miabi-proxy}

  # Named from the same variable Miabi reads, so they can never disagree.
  miabi-internal:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-internal
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: ${MIABI_INTERNAL_NETWORK:-miabi-internal}
