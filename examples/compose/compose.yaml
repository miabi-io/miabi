# Miabi — full-featured single-node stack (example).
#
# A copy-and-run reference that turns on the optional pieces most self-hosters
# want: the reverse-proxy gateway (TLS/ACME), the built-in container registry,
# one-click public app URLs (wildcard domain), and an externalized log store on
# a shared volume. It also shows how to scale the background worker out of the
# panel process.
#
# This is the only Compose stack Miabi ships. For a Miabi-managed install (which is
# what lets `miabi update` replace the control plane), use ../../deploy/install.sh.
#
# Quick start:
#   cp .env.example .env         # then edit: domains + secrets (openssl rand -hex 32)
#   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
#   docker compose up -d
#
# DNS: point your panel domain AND *.<apps base domain> at this host, so Goma
# can issue certs and serve one-click app URLs.
#
# TWO NETWORKS. `miabi` is the shared one every routed app joins; `miabi-internal`
# is private to the platform — PostgreSQL, Redis and the control plane sit only
# there, and the gateway is the one service on both. Everything on a Docker network
# can dial everything else on it by name, and the control-plane database holds a
# single superuser password covering every workspace, so an exposed app being
# compromised must not put it within reach.
#
# UPGRADING an existing stack: add MIABI_INTERNAL_NETWORK=miabi-internal to your
# .env before `docker compose up -d`. Without it the control plane does not know
# the private network exists, and the helper containers it runs out of process
# (platform backups, the built-in registry) stay on `miabi` alone — where the
# database no longer is.

services:
  miabi-postgres:
    image: postgres:17-alpine
    # Platform identity: lets Miabi recognize its own stack
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-db
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MIABI_DB_USER:-miabi}
      POSTGRES_PASSWORD: ${MIABI_DB_PASSWORD:?set MIABI_DB_PASSWORD}
      POSTGRES_DB: ${MIABI_DB_NAME:-miabi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Private network only. No published ports either: publishing 5432 on a VPS is
    # how self-hosted databases end up in breach reports, and leaving it on the
    # network every routed app joins is the same mistake with an extra hop.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIABI_DB_USER:-miabi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  miabi-redis:
    image: redis:7-alpine
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-cache
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${MIABI_REDIS_PASSWORD:?set MIABI_REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    # Private network only. The password below is shared with the gateway, so it is
    # readable in `docker inspect` of that container — and write access to the asynq
    # queue Redis holds is code execution in the worker.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MIABI_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reverse proxy: terminates TLS (ACME/Let's Encrypt), routes the panel domain
  # to Miabi, and serves the per-app route files Miabi writes into the shared
  # providers volume. goma.yml here interpolates the domains + Redis password
  # from this service's environment.
  gateway:
    image: jkaninda/goma-gateway:0.14.0
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: gateway
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    depends_on:
      miabi-redis: { condition: service_healthy }
    environment:
      MIABI_DOMAIN: ${MIABI_DOMAIN:?set MIABI_DOMAIN}
      MIABI_ACME_EMAIL: ${MIABI_ACME_EMAIL:-admin@example.com}
      MIABI_REDIS_PASSWORD: ${MIABI_REDIS_PASSWORD}
      # Workspace Analytics: Goma publishes a per-request event stream to Redis
      # and Miabi rolls it up. Also configurable in goma.yml (`analytics:`);
      # these win, and keep the toggle next to the rest of the stack's wiring.
      GOMA_ANALYTICS_ENABLED: "true"
      GOMA_ANALYTICS_STREAM: ${MIABI_ANALYTICS_STREAM:-goma:analytics}
      # Country data for the analytics panels + the geoBlock middleware. Goma
      # ships NO database — every GeoIP dataset carries license terms only you
      # can accept — so nothing resolves until you mount one (see below), and
      # until then the country panels stay empty while everything else works.
      # This path must match the mount below: an explicit GOMA_GEOIP_DB is used
      # exactly as given, with no fallback to the well-known names.
      GOMA_GEOIP_DB: /etc/goma/country.mmdb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./goma.yml:/etc/goma/goma.yml:ro
      - gateway-providers:/etc/goma/providers
      - gateway-certs:/etc/letsencrypt
      # GeoIP (optional): download a country-level .mmdb — MaxMind GeoLite2,
      # DB-IP Lite or IP2Location LITE all work — put it next to this file, and
      # uncomment. Without it the "Top countries" panels stay empty.
      # - ./country.mmdb:/etc/goma/country.mmdb:ro
    # The one service on both, deliberately: `miabi-internal` to reach Miabi and
    # Redis, `miabi` to reach your apps and the internet for ACME. Being the only
    # bridge is what keeps the shared network ingress-only — traffic crosses into
    # the platform at a proxy that terminates TLS and applies your middlewares,
    # not at a flat Docker bridge.
    networks: [miabi-internal, miabi]

  # Control plane: single binary serving the API + web UI. The background worker
  # runs embedded here by default (see the optional `miabi-worker` below to scale
  # it out). This is also the process that holds runner tunnels and builds.
  miabi:
    image: ${MIABI_IMAGE:-miabi/miabi:latest}
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    # Runs as root by default. To run unprivileged, uncomment `user` below — the
    # image ships a miabi account (uid/gid 10001) and its data dirs are owned by
    # it, so named volumes just work. group_add still grants Docker socket access
    # either way:
    #   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
    # user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      miabi-postgres: { condition: service_healthy }
      miabi-redis: { condition: service_healthy }
    # Every Miabi setting comes from .env — there is no second place to look, and
    # nothing to edit in this file. See .env.example for what must be filled in.
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-providers:/etc/goma/providers
      # Externalized log store (deploy/pipeline/job/backup logs). Keep this on a
      # volume so logs survive restarts — and share the SAME volume with the
      # optional worker below so the panel can read the logs the worker writes.
      - miabi-logs:/var/lib/miabi/logs
      - /proc:/host/proc:ro
    # Private network only. Nothing dials it on the shared one — the gateway reaches
    # it as a route backend from `miabi-internal`, and nodes, agents and runners use
    # its public URL. Reaching :9000 directly would be plaintext HTTP that bypasses
    # every route middleware you configured, and an SSRF target for any app.
    networks: [miabi-internal]

  # OPTIONAL — scale the background worker out of the panel process. It consumes
  # the local job/deploy/backup queues; the panel's embedded worker keeps the
  # remote-node + runner-dispatch work (it holds the tunnels). It MUST mount the
  # same miabi-logs volume so the panel can read the logs it externalizes.
  # Uncomment to enable.
  # miabi-worker:
  #   image: ${MIABI_IMAGE:-miabi/miabi:latest}
  #   command: ["worker"]
  #   restart: unless-stopped
  #   group_add: ["${DOCKER_GID:-999}"]
  #   depends_on:
  #     miabi-postgres: { condition: service_healthy }
  #     miabi-redis: { condition: service_healthy }
  #   env_file: [.env]
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - miabi-logs:/var/lib/miabi/logs
  #   networks: [miabi-internal]

volumes:
  pgdata:
  redisdata:
  gateway-providers:
  gateway-certs:
  miabi-logs:

networks:
  # Shared: the gateway plus every app container Miabi exposes with a route.
  miabi:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: miabi

  # Private: the platform talking to itself. The name comes from the same variable
  # Miabi reads, so the network and the control plane can never disagree about it.
  miabi-internal:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-internal
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: ${MIABI_INTERNAL_NETWORK:-miabi-internal}
