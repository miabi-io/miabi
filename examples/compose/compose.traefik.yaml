# Traefik instead of Goma: routes, wildcard URLs, rolling deploys, the registry and analytics need Goma and are inert here.

services:
  miabi-postgres:
    image: postgres:17-alpine
    # Platform identity: lets Miabi recognize its own stack.
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-db
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MIABI_DB_USER:-miabi}
      POSTGRES_PASSWORD: ${MIABI_DB_PASSWORD:?set MIABI_DB_PASSWORD}
      POSTGRES_DB: ${MIABI_DB_NAME:-miabi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Private network only: this database's superuser password covers every workspace and secret.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIABI_DB_USER:-miabi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  miabi-redis:
    image: redis:7-alpine
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-cache
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${MIABI_REDIS_PASSWORD:?set MIABI_REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    # Private network only: write access to the asynq queue is code execution in the worker.
    networks: [miabi-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MIABI_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only containers with traefik.enable=true are exposed, reached over `miabi-proxy`.
  traefik:
    image: traefik:v3.3
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: gateway
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${MIABI_PROXY_NETWORK:-miabi-proxy}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${MIABI_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    depends_on:
      miabi-redis: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Harden with a docker-socket-proxy instead of mounting the socket directly.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    # The only service on both networks: apps on miabi-proxy, the control plane on miabi-internal.
    networks: [miabi-proxy, miabi-internal]

  miabi:
    image: ${MIABI_IMAGE:-miabi/miabi:latest}
    restart: unless-stopped
    # Runs as root by default. To run unprivileged, uncomment `user` below — the
    # image ships a miabi account (uid/gid 10001) and its data dirs are owned by
    # it, so named volumes just work. group_add still grants Docker socket access
    # either way:
    #   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
    # user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      miabi-postgres: { condition: service_healthy }
      miabi-redis: { condition: service_healthy }
    # Every Miabi setting comes from .env; see .env.example for what must be filled in.
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Share this volume with the optional worker so the panel can read its logs.
      - miabi-logs:/var/lib/miabi/logs
      - /proc:/host/proc:ro
    # The one place Miabi itself carries traefik.* labels; apps get theirs via the panel.
    labels:
      - "traefik.enable=true"
      # The control plane is not on the provider default network; without this Traefik finds no address and 502s.
      - "traefik.docker.network=${MIABI_INTERNAL_NETWORK:-miabi-internal}"
      - "traefik.http.routers.miabi.rule=Host(`${MIABI_DOMAIN:?set MIABI_DOMAIN}`)"
      - "traefik.http.routers.miabi.entrypoints=websecure"
      - "traefik.http.routers.miabi.tls.certresolver=le"
      - "traefik.http.services.miabi.loadbalancer.server.port=9000"
      # Platform identity (internal/docker/labels.go), in list form alongside Traefik's labels.
      - "io.miabi.part-of=miabi"
      - "io.miabi.role=control-plane"
      - "io.miabi.managed-by=compose"
      - "io.miabi.protected=true"
    # Private network only; Traefik reaches it there.
    networks: [miabi-internal]

  # OPTIONAL — scale the background worker out of the panel process. It MUST
  # mount the same miabi-logs volume so the panel can read what it externalizes.
  # Uncomment to enable.
  # miabi-worker:
  #   image: ${MIABI_IMAGE:-miabi/miabi:latest}
  #   command: ["worker"]
  #   restart: unless-stopped
  #   group_add: ["${DOCKER_GID:-999}"]
  #   depends_on:
  #     miabi-postgres: { condition: service_healthy }
  #     miabi-redis: { condition: service_healthy }
  #   env_file:
  #     - .env
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - miabi-logs:/var/lib/miabi/logs
  #   networks: [miabi-internal]

volumes:
  pgdata:
  redisdata:
  traefik-certs:
  miabi-logs:

networks:
  # Shared: Traefik plus every app container you expose with traefik.* labels.
  miabi-proxy:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: ${MIABI_PROXY_NETWORK:-miabi-proxy}

  # Named from the same variable Miabi reads, so they can never disagree.
  miabi-internal:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-internal
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    name: ${MIABI_INTERNAL_NETWORK:-miabi-internal}
