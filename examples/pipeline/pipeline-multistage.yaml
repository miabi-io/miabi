# `run:` is a shell command in the step image; export vars to later steps via $MIABI_ENV; MIABI_* names are reserved.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: shop-web-release
on:
  push:
    branches: [main]
  manual: true
  schedule: "0 3 * * *"   # nightly at 03:00 (registered in the cron scheduler)
env:
  NODE_ENV: production
  # Resolved from the vault at dispatch and masked in logs; a missing secret fails the run up front.
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
steps:
  - name: test
    image: node:20
    env:
      CI: "true"          # step env: adds to the pipeline's, and wins on a collision
    run: "npm ci && npm test"
  - name: build
    uses: build             # builds /workspace, records an Image row + digest, sets run.image_id
    dockerfile: Dockerfile
  - name: scan
    image: aquasec/trivy:latest
    continue-on-error: true   # report vulnerabilities but don't block the deploy
    # trivy pulls from the registry, so pass the runner's credentials; add TRIVY_INSECURE=true for plain HTTP/self-signed.
    run: "TRIVY_USERNAME=$MIABI_REGISTRY_USER TRIVY_PASSWORD=$MIABI_REGISTRY_TOKEN trivy image --exit-code 1 --severity HIGH,CRITICAL $MIABI_IMAGE"
  - name: deploy
    uses: deploy
    app: shop-web           # optional: target an app other than the pipeline's bound one (uid or id)
