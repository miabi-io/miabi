# Repository-bound: the runner clones the repo into /workspace, builds and pushes, but cannot deploy.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: acme-api-image
on:
  push:
    branches: [main]   # a push webhook fires this pipeline at the commit it carries
  manual: true         # and you can run it by hand
  # schedule: "0 3 * * *"   # nightly rebuild, e.g. to pick up base-image patches
env:
  CGO_ENABLED: "0"
steps:
  - name: test
    image: golang:1.27
    run: "go test ./..."

  - name: build
    uses: build
    dockerfile: Dockerfile   # relative to the repository root; default: Dockerfile
    # context: .             # build context, if it differs from the root
    cache: false             # repository-bound builds are uncached today anyway

  # Optional: $MIABI_IMAGE is the digest-pinned reference the build step pushed.
  - name: scan
    image: aquasec/trivy:latest
    continue-on-error: true
    run: "TRIVY_USERNAME=$MIABI_REGISTRY_USER TRIVY_PASSWORD=$MIABI_REGISTRY_TOKEN trivy image --exit-code 1 --severity HIGH,CRITICAL $MIABI_IMAGE"

  # A deploy step is refused on a repository-bound pipeline: there is no application to deploy to.
