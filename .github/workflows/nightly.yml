name: Nightly

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

# The tag is rolling, so only the newest push matters.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # CI does not run on this branch, so test here rather than publish an unverified nightly.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test Community Edition
        run: go test -race ./...

      - name: Test Enterprise Edition
        run: go test -race -tags enterprise ./...

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No git tag to read, so the version is derived from the date and commit.
      - name: Set version
        run: |
          echo "VERSION=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Miabi (rootless)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            GO_TAGS=enterprise
            LICENSE_KEYRING=${{ vars.LICENSE_KEYRING }}
          tags: |
            miabi/miabi:nightly-rootless

      - name: Build and push Miabi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            GO_TAGS=enterprise
            LICENSE_KEYRING=${{ vars.LICENSE_KEYRING }}
          tags: |
            miabi/miabi:nightly

      - name: Summary
        run: |
          {
            echo "### Nightly published"
            echo
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`miabi/miabi\` | \`nightly\`, \`nightly-rootless\` |"
            echo
            echo "Built from \`${GITHUB_SHA::7}\`, reported as \`${VERSION}\`."
            echo
            echo "The tag is rolling: \`docker pull\` again to move forward, and pin a"
            echo "released version instead if you need the same bits twice."
          } >> "$GITHUB_STEP_SUMMARY"
