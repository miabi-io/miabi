name: Release

on:
  push:
    tags: ["v1.*"]

permissions:
  contents: read

# The Goma Gateway a release provisions is the stable one on versions.miabi.io when the tag is
# built, baked into the binary (pkg/bundled) so each release still pins a concrete version. Publish
# a new gateway in the versions repo to move it. A repository variable overrides it, to re-cut a
# release against a specific gateway:
#
#   gh variable set GOMA_VERSION --body v1.1.2

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.gateway.outputs.version }}
    steps:
      - name: Resolve the gateway version
        id: gateway
        env:
          OVERRIDE: ${{ vars.GOMA_VERSION }}
        run: |
          set -euo pipefail
          v="${OVERRIDE}"
          if [ -z "$v" ]; then
            v="v$(curl -fsSL https://versions.miabi.io/v1/index.json | jq -er '.components.gateway.stable.version')"
          fi
          # It may come from a repository variable, so validate rather than trust it.
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::gateway version must look like v1.2.3, got '$v'"; exit 1 ;;
          esac
          echo "Gateway: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: versions
    permissions:
      contents: write
    env:
      GOMA_VERSION: ${{ needs.versions.outputs.gateway }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the changelog can diff against prior tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the downloadable binaries so a license can unlock
          # Enterprise features. Empty is a harmless no-op — the binary still
          # runs as free Community until a valid license is installed.
          LICENSE_KEYRING: ${{ vars.LICENSE_KEYRING }}

  # One edition. Built with `-tags enterprise`, the image runs as free Community
  # until a license is installed, so the frictionless path is: pull `latest`, add
  # a license later, and features unlock with no re-pull or redeploy. Tags are
  # unsuffixed — there is no `-ce`/`-ee` split.
  image:
    runs-on: ubuntu-latest
    needs: versions
    env:
      GOMA_VERSION: ${{ needs.versions.outputs.gateway }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # The commit's own timestamp, not "now": re-running this workflow on the
          # same tag then produces the same binary.
          echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          # A prerelease tag (v1.9.4-rc.1) must not move the floating tags: `latest` is
          # what an unpinned pull and the installer resolve to. Keys on the same "-"
          # suffix GoReleaser's `prerelease: auto` does, so both agree on what an rc is.
          case "${GITHUB_REF_NAME}" in
            *-*) echo "PRERELEASE=true"  >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The Miabi image (API + web UI in one binary) is published to Docker Hub
      # (miabi/miabi, the platform default).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Rootless variant: same binary + web UI on the alpine runtime, running as an
      # unprivileged user (docker/Dockerfile.rootless).
      - name: Build and push Miabi (rootless)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GO_TAGS=enterprise
            LICENSE_KEYRING=${{ vars.LICENSE_KEYRING }}
            GOMA_VERSION=${{ env.GOMA_VERSION }}
          tags: |
            miabi/miabi:${{ env.VERSION }}-rootless
            ${{ env.PRERELEASE == 'false' && 'miabi/miabi:rootless' || '' }}
            ${{ env.PRERELEASE == 'false' && 'miabi/miabi:latest-rootless' || '' }}

      # Default runtime (Alpine, root).
      - name: Build and push Miabi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GO_TAGS=enterprise
            LICENSE_KEYRING=${{ vars.LICENSE_KEYRING }}
            GOMA_VERSION=${{ env.GOMA_VERSION }}
          tags: |
            miabi/miabi:${{ env.VERSION }}
            ${{ env.PRERELEASE == 'false' && 'miabi/miabi:latest' || '' }}



  publish-version:
    runs-on: ubuntu-latest
    needs: [versions, release, image]
    permissions:
      contents: read
    env:
      GOMA_VERSION: ${{ needs.versions.outputs.gateway }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Verify every published image exists
        run: |
          set -euo pipefail
          # Query the registry itself; a manifest can lag a few seconds behind the push.
          assert_image() {
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$1" >/dev/null 2>&1; then
                echo "  ok $1"; return 0
              fi
              echo "  waiting for $1 (attempt ${attempt}/5)"; sleep 10
            done
            echo "::error::$1 was never published; refusing to advertise it on versions.miabi.io"
            exit 1
          }
          assert_image "miabi/miabi:${GITHUB_REF_NAME#v}"
          assert_image "jkaninda/goma-gateway:${GOMA_VERSION#v}"

      - name: Tested component versions
        id: bundle
        run: |
          set -euo pipefail
          # Agent, runner and CLI release on their own cadence, so this release was tested with the
          # stable ones live now.
          index="$(curl -fsSL https://versions.miabi.io/v1/index.json)"
          agent="$(jq -er '.components.agent.stable.version' <<<"$index")"
          runner="$(jq -er '.components.runner.stable.version' <<<"$index")"
          cli="$(jq -er '.components.cli.stable.version' <<<"$index")"
          echo "components=gateway=${GOMA_VERSION#v},agent=${agent},runner=${runner},cli=${cli}" >> "$GITHUB_OUTPUT"

      - uses: miabi-io/versions@main
        with:
          component: miabi
          version: ${{ github.ref_name }}
          components: ${{ steps.bundle.outputs.components }}
          token: ${{ secrets.VERSIONS_TOKEN }}
