name: CI

# Runs on every push to the mainline branches and on all pull requests. Tag
# pushes are handled by release.yml (which builds images + the GitHub release),
# so they are excluded here to avoid duplicate runs.
on:
  push:
    branches: [main, dev,feat/migration-docker-to-moby]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (CE + EE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint v2 config (.golangci.yml). We lint both build tag sets:
      # the Community build and the Enterprise build (-tags enterprise), so
      # enterprise-only files are covered too.
      - name: Lint Community Edition
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Lint Enterprise Edition
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags enterprise

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The SDK boundary, enforced independently of depguard's glob semantics: no
      # package outside internal/docker may import a Docker/Moby SDK.
      - name: Docker SDK is confined to internal/docker
        run: |
          hits=$(git grep -l -E 'github.com/docker/docker|github.com/moby/moby|github.com/docker/go-connections' -- '*.go' ':!internal/docker/*' ':!*_test.go' || true)
          if [ -n "$hits" ]; then
            echo "::error::Docker/Moby SDK imported outside internal/docker:"
            echo "$hits"
            exit 1
          fi
          echo "OK: the Docker SDK is confined to internal/docker."

      # The deprecated github.com/docker/docker module must never re-enter the
      # module graph (it stops at v28 and no longer gets security fixes). This is
      # the module-level guard; the git-grep step above is the import-level one.
      - name: docker/docker must not return to the module graph
        run: |
          if go list -m all | grep -q 'github.com/docker/docker'; then
            echo "::error::github.com/docker/docker is back in the module graph — the migration to moby/moby is regressed."
            go list -m all | grep 'github.com/docker/docker'
            exit 1
          fi
          echo "OK: github.com/docker/docker is absent from the module graph."

      # Blocking: the moby/moby migration removed the unfixable
      # docker/docker@v27.5.1 CVEs, so the scan is clean and a regression that
      # reintroduces a called vulnerability fails CI here.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test Community Edition
        run: go test -race ./...

      - name: Test Enterprise Edition
        run: go test -race -tags enterprise ./...

  integration:
    name: Integration (engine ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ["25", "26", "27", "28", "29"]
    services:
      docker:
        image: docker:${{ matrix.engine }}-dind
        # The dind image ships no HEALTHCHECK, so without one here Actions starts the
        # container and runs the steps immediately — but dockerd needs ~35s to bind
        # 2375, and the suite fails every test on a refused connection. Probing over
        # TCP (not the unix socket) gates on the listener the tests actually dial.
        options: >-
          --privileged
          --health-cmd "docker -H tcp://127.0.0.1:2375 info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: "" # serve plain TCP on 2375 for the test host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for the engine
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker -H tcp://127.0.0.1:2375 version >/dev/null 2>&1; then
              docker -H tcp://127.0.0.1:2375 version --format \
                'engine {{.Server.Version}} (API {{.Server.APIVersion}}) ready after '"${attempt}"' attempt(s)'
              exit 0
            fi
            sleep 2
          done
          echo "::error::engine ${{ matrix.engine }} never accepted TCP on 2375"
          docker logs "${{ job.services.docker.id }}" 2>&1 | tail -50
          exit 1

      # Characterization suite in internal/docker: skips unless
      # MIABI_TEST_DOCKER_HOST is set, so it is a no-op for local `go test ./...`.
      # The engines green here are Miabi's supported Docker Engine range.
      - name: Integration tests against engine ${{ matrix.engine }}
        run: go test -tags integration -race -v ./internal/docker/...
        env:
          MIABI_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
          # The DinD engine is throwaway, so the swarm tests may initialize a
          # single-node swarm on it.
          MIABI_TEST_SWARM: "1"

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      # `npm run build` runs vue-tsc (typecheck) then vite build, so this
      # catches type errors as well as build breakage.
      - name: Typecheck and build
        run: npm --prefix web run build

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
