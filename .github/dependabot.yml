version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Grouped to avoid a trickle of one-line PRs; majors stay ungrouped because they need reading.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch

  # Matches every file with "dockerfile" in its name, so Dockerfile.rootless is covered too.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - "*"
