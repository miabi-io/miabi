name: Feature request
description: Suggest a new feature or an improvement to Miabi
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Search the [existing issues](https://github.com/miabi-io/miabi/issues) first, and add a 👍 to a matching one rather than opening a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Miabi to handle this?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples from other tools, or anything else that helps.
