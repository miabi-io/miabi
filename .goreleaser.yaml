# The web UI is embedded at build time, so each archive is one self-contained binary.
version: 2

project_name: miabi

before:
  hooks:
    - go mod download
    # Build the Vue UI and stage it where `go build` embeds it (internal/web).
    - npm --prefix web ci
    - npm --prefix web run build
    - rm -rf internal/web/dist
    - cp -r web/dist internal/web/dist
    # The HTTP healthcheck probe copied into app containers (internal/healthprobe).
    - make build-probe

builds:
  - id: miabi
    main: ./cmd/miabi
    binary: miabi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Enterprise code is compiled in but dormant until a valid license is installed.
    tags:
      - enterprise
    ldflags:
      - -s -w
      - -X github.com/miabi-io/miabi/internal/config.Version={{ .Version }}
      - -X github.com/miabi-io/miabi/internal/config.CommitID={{ .ShortCommit }}
      - -X github.com/miabi-io/miabi/internal/config.BuildDate={{ .CommitDate }}
      # Baked license-signing key; empty is a harmless no-op (stays Community).
      - -X github.com/miabi-io/miabi/internal/enterprise.embeddedKeyring={{ .Env.LICENSE_KEYRING }}
      # The Goma Gateway release to provision, resolved from versions.miabi.io by the workflow.
      - -X github.com/miabi-io/miabi/pkg/bundled.gatewayVersion={{ index .Env "GOMA_VERSION" }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: miabi
    ids:
      - miabi
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: miabi-io
    name: miabi
  draft: false
  prerelease: auto
  name_template: "Miabi {{ .Tag }}"
  footer: |
    ---

    ## Docker images

    Container images for this release are published to Docker Hub (`miabi/miabi`),
    tagged `latest`, `{{ .Tag }}`, and the `-rootless` variants of each.

    The web UI is embedded in the binary — each archive is a single self-contained
    executable that serves both the API and the UI. No extra files to deploy.
