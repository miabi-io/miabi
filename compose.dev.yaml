# Local dev stack with throwaway credentials and no gateway; for production use examples/compose/ or deploy/install.sh.
services:
  postgres:
    image: postgres:17-alpine
    # Same platform identity as production, so dev exercises the same import/protection paths.
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-db
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    environment:
      POSTGRES_USER: miabi
      POSTGRES_PASSWORD: miabi
      POSTGRES_DB: miabi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miabi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: platform-cache
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  miabi:
    labels:
      io.miabi.part-of: miabi
      io.miabi.role: control-plane
      io.miabi.managed-by: compose
      io.miabi.protected: "true"
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MIABI_DB_HOST: postgres
      MIABI_DB_USER: miabi
      MIABI_DB_PASSWORD: miabi
      MIABI_DB_NAME: miabi
      MIABI_REDIS_ADDR: redis:6379
      MIABI_ENV: dev
    ports:
      - "9000:9000"
    volumes:
      # Execution logs are externalized here (MIABI_LOG_DIR).
      - miabi-logs:/var/lib/miabi/logs
      # Optional: real host CPU/memory on the admin Node page (MIABI_HOST_PROC); without it Miabi falls back to /proc.
      - /proc:/host/proc:ro

volumes:
  pgdata:
  miabi-logs:
